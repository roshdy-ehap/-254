name: 🏗️ Build Mizan POS

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ══════════════════════════════════════════════════════════════
  #  BUILD — Windows x64
  # ══════════════════════════════════════════════════════════════
  build-windows:
    name: 🪟 Windows x64
    runs-on: windows-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci --legacy-peer-deps

      - name: 🔨 Build Windows EXE
        run: npm run build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 📋 List dist folder
        run: dir dist

      - name: 📤 Upload artifact (90 days)
        uses: actions/upload-artifact@v4
        with:
          name: mizan-pos-windows-x64
          path: |
            dist/*.exe
            dist/*.msi
            dist/latest.yml
          retention-days: 90
          if-no-files-found: warn

  # ══════════════════════════════════════════════════════════════
  #  ROLLING RELEASE — يتحدث على كل push → ملف دائم
  # ══════════════════════════════════════════════════════════════
  rolling-release:
    name: 📌 Update Latest (Permanent)
    needs: build-windows
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 📥 Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: mizan-pos-windows-x64
          path: ./release-files

      - name: 🔖 Get build info
        id: info
        run: |
          VERSION=$(node -p "require('./package.json').version")
          DATE=$(date +'%Y-%m-%d %H:%M UTC')
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "date=$DATE" >> $GITHUB_OUTPUT
          echo "sha=$SHORT_SHA" >> $GITHUB_OUTPUT

      - name: 🗑️ Delete old latest tag
        run: |
          git push origin :refs/tags/latest 2>/dev/null || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔄 Create/Update latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "⚖️ ميزان POS — آخر إصدار (v${{ steps.info.outputs.version }})"
          body: |
            ## ⚖️ ميزان POS v${{ steps.info.outputs.version }}

            > 📅 **آخر تحديث:** ${{ steps.info.outputs.date }}
            > 🔧 **Build:** `${{ steps.info.outputs.sha }}`

            ---

            ### 📥 تحميل التطبيق

            | الملف | النظام |
            |-------|--------|
            | `ميزان POS Setup.exe` | Windows 10 / 11 (64-bit) |

            ---

            ### 🚀 طريقة التثبيت
            1. انقر على `ميزان POS Setup.exe` في الأسفل ⬇️
            2. شغّله ← التالي ← تثبيت
            3. أيقونة على سطح المكتب → انقر عليها

            ### 🔑 الدخول الأول
            | المستخدم | كلمة المرور | الدور |
            |----------|-------------|-------|
            | `admin` | `admin123` | مدير عام |
            | `cashier` | `cash123` | كاشير |
            | `manager` | `mgr123` | مدير |

            > ⚠️ غيّر كلمات المرور من: الإعدادات ← الموظفون

            ### 💾 البيانات
            تُحفظ تلقائياً في `ميزان-بيانات\` بجانب التطبيق

            ---
            *يتحدث تلقائياً عند كل تعديل — الملف دائم طول ما الـ repo موجود*
          files: |
            ./release-files/*.exe
            ./release-files/*.msi
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ══════════════════════════════════════════════════════════════
  #  VERSIONED RELEASE — عند push tag مثل: v3.1.0
  # ══════════════════════════════════════════════════════════════
  versioned-release:
    name: 🎉 Versioned Release
    needs: build-windows
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 📥 Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: mizan-pos-windows-x64
          path: ./release-files

      - name: 🔖 Get version
        id: ver
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: 🎉 Create versioned release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "ميزان POS v${{ steps.ver.outputs.version }}"
          body: |
            ## ⚖️ ميزان POS v${{ steps.ver.outputs.version }}

            ### 📦 ملفات التثبيت
            - **`ميزان POS Setup.exe`** — Windows 64-bit

            ### 📋 التغييرات
            راجع [CHANGELOG.md](./CHANGELOG.md)
          files: |
            ./release-files/*.exe
            ./release-files/*.msi
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
